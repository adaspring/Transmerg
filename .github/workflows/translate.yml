name: Translate HTML Pages

on:
  push:
    paths:
      - '**.html'
      - 'identification.py'
      - 'translator_initial.py'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Run Identification Script
        run: python identification.py

      - name: Run Translation Script
        run: python translator_initial.py

      - name: Commit and push translated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add '*.html' translation_db.json
          git commit -m "Auto-translated HTML pages" || echo "No changes to commit"
          git push
